name: Build and Deploy Compose Web to GitHub Pages (Actions deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Diagnostic step removed to avoid YAML parsing issues; deployment will use the PAT in 'TOKEN_TOKEN' secret.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production webpack bundle
        run: ./gradlew :composeApp:wasmJsBrowserProductionWebpack --no-daemon --no-parallel

      - name: Prepare site directory
        run: |
            PUBLISH_DIR=./build/site
            rm -rf "$PUBLISH_DIR"
            mkdir -p "$PUBLISH_DIR"
            cp composeApp/build/kotlin-webpack/wasmJs/productionExecutable/*.wasm "$PUBLISH_DIR/" || true
            cp composeApp/build/kotlin-webpack/wasmJs/productionExecutable/*.js "$PUBLISH_DIR/"
            cp composeApp/src/commonMain/resources/index.html "$PUBLISH_DIR/"
            cp composeApp/src/commonMain/resources/styles.css "$PUBLISH_DIR/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

