name: Build and Deploy Compose Web to GitHub Pages (Pages action)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build production webpack bundle
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon --no-parallel

      - name: Upload production build to Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./composeApp/build/distributions

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

