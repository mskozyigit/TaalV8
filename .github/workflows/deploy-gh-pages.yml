name: Build and Deploy Compose Web to GitHub Pages (Actions deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug: verify PAT access to GitHub API
        env:
          TOKEN: ${{ secrets.TOKEN_TOKEN }}
        run: |
          echo "Checking token access (will not print token)..."
          echo "User info:"
          curl -s -H "Authorization: token $TOKEN" https://api.github.com/user | jq '{login,id,type}' || true
          echo "Repo access check (status):"
          status=$(curl -o /dev/null -s -w "%{http_code}" -H "Authorization: token $TOKEN" https://api.github.com/repos/mskozyigit/TaalV8)
          echo "HTTP status for repo access: $status"
          if [ "$status" -ne 200 ]; then
            echo "Token cannot access repository (status $status). Please verify secret value and token scopes (repo, pages)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build production webpack bundle
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon --no-parallel

      - name: Prepare site directory
        run: |
          PUBLISH_DIR=./build/site
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          cp -r composeApp/build/kotlin-webpack/js/productionExecutable/* "$PUBLISH_DIR/"
          cp composeApp/src/webMain/resources/index.html "$PUBLISH_DIR/"
          cp composeApp/src/webMain/resources/styles.css "$PUBLISH_DIR/"

      - name: Publish to gh-pages with peaceiris
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use the PAT stored in repository secrets. Your secret is named TOKEN_TOKEN so use that.
          personal_token: ${{ secrets.TOKEN_TOKEN }}
          publish_dir: ./build/site
          keep_files: false

