name: Build and Deploy Compose Web to GitHub Pages (Actions deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Diagnostic step removed to avoid YAML parsing issues; deployment will use the PAT in 'TOKEN_TOKEN' secret.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build production webpack bundle
        run: ./gradlew :composeApp:jsBrowserProductionWebpack --no-daemon --no-parallel

      - name: Prepare site directory
        run: |
          PUBLISH_DIR=./build/site
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          cp -r composeApp/build/kotlin-webpack/js/productionExecutable/* "$PUBLISH_DIR/"
          cp composeApp/src/webMain/resources/index.html "$PUBLISH_DIR/"
          cp composeApp/src/webMain/resources/styles.css "$PUBLISH_DIR/"

      - name: Test PAT access (do not print token)
        env:
          TOKEN: ${{ secrets.TOKEN_TOKEN }}
        run: |
          echo "Checking PAT access to GitHub API..."
          user_status=$(curl -o /dev/null -s -w "%{http_code}" -H "Authorization: token $TOKEN" https://api.github.com/user)
          echo "User endpoint HTTP status: $user_status"
          if [ "$user_status" -ne 200 ]; then
            echo "PAT cannot access user endpoint (status $user_status). Check token or SSO/permissions."
            exit 1
          fi
          repo_status=$(curl -o /dev/null -s -w "%{http_code}" -H "Authorization: token $TOKEN" https://api.github.com/repos/mskozyigit/TaalV8)
          echo "Repo endpoint HTTP status: $repo_status"
          if [ "$repo_status" -ne 200 ]; then
            echo "PAT cannot access repository endpoint (status $repo_status). Ensure token has repo access and is authorized for this org/repo."
            exit 1
          fi
          echo "PAT appears valid for repo access."

      - name: Deploy site to gh-pages (manual push using PAT)
        run: |
          set -e
          echo "Publishing site by manual git push using TOKEN_TOKEN (masked)..."
          cd ./build/site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: publish site from GitHub Actions"
          # Push to gh-pages using the PAT from secrets (masked in logs)
          git push --force "https://x-access-token:${{ secrets.TOKEN_TOKEN }}@github.com/mskozyigit/TaalV8.git" HEAD:gh-pages

